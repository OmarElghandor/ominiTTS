services:
  omnivoice-api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MODEL_STORE_DIR: /data/omnivoice-model
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${OMNIVOICE_VOLUME_HOST_PATH:-/workspace/omnivoice-model}:/data/omnivoice-model
    restart: unless-stopped
    # GPU reservation — active on RunPod pods and local dev with nvidia-container-toolkit.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
